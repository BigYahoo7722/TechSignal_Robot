name: GameSignal News Bot

on:
  schedule:
    # هر ساعت، در دقیقه‌ی ۱۵ (تا همزمان با اجرای ربات تک‌سیگنال قاطی نشود)
    - cron: "15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gamesignal-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run GameSignal bot
        env:
          GAMING_BOT_TOKEN: ${{ secrets.GAMING_BOT_TOKEN }}
          GAMING_CHANNEL_ID: ${{ secrets.GAMING_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main_gaming.py

      - name: Commit updated sent_news_gaming.json (if changed)
        run: |
          git config user.name "gamesignal-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- sent_news_gaming.json; then
            git add sent_news_gaming.json
            git commit -m "chore: update gaming sent news log [skip ci]"
            for i in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                echo "Push successful."
                break
              fi
              echo "Push failed (attempt $i), retrying in 5s..."
              sleep 5
            done
          else
            echo "تغییری در sent_news_gaming.json وجود نداشت."
          fi
